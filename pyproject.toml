[project]
name = "ilm-bot"
version = "2.0.0"
description = "Ilm yo'lida: islomiy Telegram bot va uning veb admin paneli"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram==3.31.0",
    "alembic>=1.16",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.10",
    "python-multipart>=0.0.20",
    "redis>=6",
    "sqlalchemy[asyncio]>=2.0.40",
    "tzdata>=2025.2",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "fakeredis>=2.30",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.uv]
package = false
required-version = ">=0.9"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
