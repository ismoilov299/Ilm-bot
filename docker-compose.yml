name: ilm-bot

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ilmbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ilmbot}
      POSTGRES_DB: ilmbot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ilmbot -d ilmbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Bir martalik: sxemani yangilaydi va boshlang'ich ma'lumotni qo'shadi (idempotent)
  migrate:
    build: .
    command: ["sh", "-c", "alembic upgrade head && python -m ilmbot.cli seed"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ilmbot:${POSTGRES_PASSWORD:-ilmbot}@postgres:5432/ilmbot
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  postgres-data:
  redis-data:
