name: CI

on:
  push:
    branches: [main, dev, relaunch]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.4"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install dependencies
        run: uv sync --locked
      - name: Lock file is up to date
        run: uv lock --check
      - name: Ruff
        run: |
          uv run --frozen ruff check
          uv run --frozen ruff format --check

  test:
    name: Tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ilmbot
          POSTGRES_PASSWORD: ilmbot
          POSTGRES_DB: ilmbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ilmbot -d ilmbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        run: pipx install "uv==${UV_VERSION}"
      - name: Install dependencies
        run: uv sync --locked
      - name: Pytest
        run: uv run --frozen pytest

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag ilm-bot:ci .
      - name: Image starts
        run: docker run --rm ilm-bot:ci
