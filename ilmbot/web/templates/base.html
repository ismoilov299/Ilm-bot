<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Boshqaruv{% endblock %} · Ilm yo'lida</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if admin %}
  <header class="top">
    <a class="brand" href="/">Ilm yo'lida</a>
    <nav>
      <a href="/" class="{{ 'on' if nav == 'dashboard' }}">Panel</a>
      <a href="/menu" class="{{ 'on' if nav == 'menu' }}">Menyu</a>
      <a href="/inventory" class="{{ 'on' if nav == 'inventory' }}">Kanal postlari</a>
      <a href="/broadcasts" class="{{ 'on' if nav == 'broadcasts' }}">Broadcast</a>
      <a href="/users" class="{{ 'on' if nav == 'users' }}">Foydalanuvchilar</a>
      <a href="/prayer-times" class="{{ 'on' if nav == 'prayer' }}">Namoz vaqtlari</a>
      <a href="/mosques" class="{{ 'on' if nav == 'mosques' }}">Masjidlar</a>
      <a href="/regions" class="{{ 'on' if nav == 'regions' }}">Shaharlar</a>
    </nav>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ admin.csrf }}">
      <button class="link" type="submit">Chiqish</button>
    </form>
  </header>
{% endif %}
  <main>
    {% if ok %}<div class="notice ok" role="status">{{ ok }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
