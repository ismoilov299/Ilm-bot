<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}Boshqaruv{% endblock %} · Ilm yo'lida</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
{% if admin %}
  <header class="top">
    <a class="brand" href="/">Ilm yo'lida</a>
    <nav>
      <a href="/" class="{{ 'on' if nav == 'dashboard' }}">Boshqaruv paneli</a>
      <a href="/broadcasts" class="{{ 'on' if nav == 'broadcasts' }}">Broadcast</a>
    </nav>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ admin.csrf }}">
      <button class="link" type="submit">Chiqish</button>
    </form>
  </header>
{% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
